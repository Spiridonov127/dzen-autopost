name: Generate and publish Zen articles

on:
  schedule:
    # 7:00 МСК = 04:00 UTC
    - cron: '0 4 * * *'
    # 20:00 МСК = 17:00 UTC
    - cron: '0 17 * * *'
  workflow_dispatch: {}   # позволяет запустить вручную кнопкой в GitHub

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate 3 articles and rebuild feed
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          SITE_URL: ${{ vars.SITE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/generate.py --count 3

      - name: Commit and push new articles
        run: |
          git config user.name "zen-bot"
          git config user.email "zen-bot@users.noreply.github.com"
          git add docs/
          git diff --cached --quiet || git commit -m "Auto: новая партия статей $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
