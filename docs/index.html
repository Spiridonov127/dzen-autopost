<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Интересные факты</title>
<style>
  body { font-family: -apple-system, Arial, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 16px; }
  a { color: #1a1a1a; }
</style>
</head>
<body>
<h1>Интересные факты</h1>
<p>Статьи публикуются автоматически. Полный список — <a href="feed.xml">RSS-лента</a>.</p>
<div id="list"></div>
<script>
fetch('articles.json').then(r => r.json()).then(items => {
  const el = document.getElementById('list');
  items.slice().reverse().forEach(a => {
    const d = document.createElement('div');
    d.style.margin = '20px 0';
    d.innerHTML = `<a href="articles/${a.slug}.html"><b>${a.title}</b></a><br><small>${a.pub_date}</small>`;
    el.appendChild(d);
  });
}).catch(() => {});
</script>
</body>
</html>
